# Render Blueprint para el API de NexDMS (NestJS) + Postgres + Redis.
#
# Cómo usarlo:
#   1. En Render: New > Blueprint, apunta a este repo (rama main).
#   2. Render crea la BD, el Redis y el web service, y cablea DATABASE_URL
#      y REDIS_URL automáticamente.
#   3. Antes del primer deploy, define ENCRYPTION_KEY (ver nota abajo).
#
# Notas:
# - Las migraciones se corren en cada deploy con el startCommand (idempotente:
#   solo aplica las pendientes), así la BD nueva de Render deja de estar vacía.
# - buildCommand usa --include=dev porque NODE_ENV=production haría que npm
#   omitiera devDependencies (nest-cli, typeorm CLL) y el build/migración fallarían.
# - Las llaves de integración (B2, Resend, Twilio, Facturapi) son opcionales:
#   el API arranca sin ellas y solo fallan al usar esa función. Añádelas en el
#   dashboard cuando las necesites (ver apps/api/.env.example).

databases:
  - name: nexdms-db
    databaseName: nexdms
    user: nexdms
    plan: free

services:
  # Redis: dependencia dura del login (guarda el refresh token). Solo interno.
  - type: redis
    name: nexdms-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # API NestJS
  - type: web
    name: nexdms-api
    runtime: node
    rootDir: apps/api
    plan: free
    # Este entorno de build no marca +x los binarios de node_modules/.bin
    # (falla 'nest: Permission denied' / 'unrs-resolver'). Por eso:
    # - --ignore-scripts evita el postinstall roto de unrs-resolver (ESLint,
    #   no se usa para compilar); luego se reconstruye bcrypt (único nativo).
    # - se invocan nest y typeorm con 'node <entry>' para no depender del bit
    #   de ejecución; el chmod es respaldo por si nest lanza tsc.
    buildCommand: "npm install --include=dev --ignore-scripts && npm rebuild bcrypt && chmod +x node_modules/.bin/* 2>/dev/null; node node_modules/@nestjs/cli/bin/nest.js build"
    startCommand: "node node_modules/typeorm/cli.js migration:run -d dist/config/database.config.js -t each && npm run start:prod"
    healthCheckPath: /api/v1/health
    envVars:
      # Node 24 (default de Render) dispara bugs de postinstall nativo; se fija
      # la LTS estable.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexdms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexdms-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # 64 caracteres hex (32 bytes). Genera con:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: ENCRYPTION_KEY
        sync: false
      # Bases de las ligas de acceso por portal (superadmin las muestra por
      # cliente como <base>/<slug>). Sin esto, caen a *.localhost.
      # Base de las ligas que se ENVÍAN al cliente final por WhatsApp/email
      # (seguimiento /t/, encuesta /s/, cotización /c/). Sin esto caen a
      # localhost:4200.
      - key: APP_PUBLIC_URL
        value: https://app.nexusqsystem.com
      - key: WEB_APP_URL
        value: https://app.nexusqsystem.com
      - key: RECEPCION_APP_URL
        value: https://recepcion.nexusqsystem.com
      - key: PWA_APP_URL
        value: https://pwa.nexusqsystem.com
      # Contacto de Nexus mostrado cuando un cliente suspendido intenta entrar.
      # Teléfono/WhatsApp se capturan en el dashboard de Render (sync:false).
      - key: NEXUS_SUPPORT_NAME
        value: Nexus Q Tech
      - key: NEXUS_SUPPORT_EMAIL
        value: soporte@nexusqtech.com
      - key: NEXUS_SUPPORT_PHONE
        sync: false
      - key: NEXUS_SUPPORT_WHATSAPP
        sync: false
      # Almacenamiento Backblaze B2 (S3-compatible) para logos/archivos. Sin
      # esto, subir logotipo falla con "Could not load credentials". Copiar los
      # valores desde apps/api/.env.
      - key: B2_ENDPOINT
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_BUCKET_URL
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_KEY_PREFIX
        sync: false
      # WhatsApp (Meta Cloud API). Las credenciales de envío son por sucursal y
      # viven en la BD; lo de aquí es de la app de Meta y aplica a todas.
      # WHATSAPP_APP_SECRET valida la firma del webhook: en producción, sin él
      # el webhook se rechaza y el bot deja de recibir mensajes.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
