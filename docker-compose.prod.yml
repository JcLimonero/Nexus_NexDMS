version: '3.9'

services:

  postgres:
    image: postgres:15-alpine
    container_name: nexDMS_postgres
    restart: always
    environment:
      POSTGRES_DB: nexdms
      POSTGRES_USER: nexdms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexdms']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexDMS_net

  redis:
    image: redis:7-alpine
    container_name: nexDMS_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - nexDMS_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: nexDMS_api
    restart: always
    env_file:
      - ./apps/api/.env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexdms:${POSTGRES_PASSWORD}@postgres:5432/nexdms
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexDMS_net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
    container_name: nexDMS_web
    restart: always
    networks:
      - nexDMS_net

  pwa:
    build:
      context: ./apps/pwa
      dockerfile: Dockerfile
      target: production
    container_name: nexDMS_pwa
    restart: always
    networks:
      - nexDMS_net

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: production
    container_name: nexDMS_admin
    restart: always
    networks:
      - nexDMS_net

  nginx:
    image: nginx:alpine
    container_name: nexDMS_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - pwa
      - admin
    networks:
      - nexDMS_net

  # Backup automático de PostgreSQL
  backup:
    image: postgres:15-alpine
    container_name: nexDMS_backup
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      B2_KEY_ID: ${B2_KEY_ID}
      B2_APP_KEY: ${B2_APP_KEY}
      B2_BUCKET_BACKUP: ${B2_BUCKET_BACKUP}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ['crond', '-f', '-d', '8']
    depends_on:
      - postgres
    networks:
      - nexDMS_net

volumes:
  postgres_data:
  redis_data:
  certbot_www:

networks:
  nexDMS_net:
    driver: bridge
