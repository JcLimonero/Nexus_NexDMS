version: '3.9'

services:

  # ─── Base de datos ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: nexdms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexdms
      POSTGRES_USER: nexdms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexdms_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexdms']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexdms_net

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexdms_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-nexdms_dev}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD:-nexdms_dev}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexdms_net

  # ─── NestJS API ───────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: nexdms_api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://nexdms:${POSTGRES_PASSWORD:-nexdms_dev}@postgres:5432/nexdms
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexdms_dev}@redis:6379
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    ports:
      - '3000:3000'
      - '9229:9229'     # Puerto de debug Node.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev
    networks:
      - nexdms_net

  # ─── Angular Web (operadores) ──────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: nexdms_web
    restart: unless-stopped
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - '4200:4200'
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run start -- --host 0.0.0.0 --poll 1000
    networks:
      - nexdms_net

  # ─── Angular PWA Mecánico ─────────────────────────────────────
  pwa:
    build:
      context: ./apps/pwa
      dockerfile: Dockerfile
      target: development
    container_name: nexdms_pwa
    restart: unless-stopped
    volumes:
      - ./apps/pwa:/app
      - /app/node_modules
    ports:
      - '4201:4200'
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run start -- --host 0.0.0.0 --poll 1000
    networks:
      - nexdms_net

  # ─── Angular Admin (superadmin Nexus Q Tech) ──────────────────
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: development
    container_name: nexdms_admin
    restart: unless-stopped
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    ports:
      - '4202:4200'
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run start -- --host 0.0.0.0 --poll 1000
    networks:
      - nexdms_net

  # ─── Nginx reverse proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexdms_nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - pwa
      - admin
    networks:
      - nexdms_net

volumes:
  postgres_data:
  redis_data:

networks:
  nexdms_net:
    driver: bridge
