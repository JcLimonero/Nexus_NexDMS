services:

  # ─── Base de datos ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: nexDMS_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexdms
      POSTGRES_USER: nexdms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexdms_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5433:5432'   # 5433 en host para evitar conflicto con Colima default (5432)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexdms']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexDMS_net

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexDMS_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-nexdms_dev}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD:-nexdms_dev}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexDMS_net

  # ─── NestJS API ───────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: nexDMS_api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      TZ: America/Mexico_City
      # La red del contenedor no tiene salida IPv6 y muchos servicios
      # resuelven a ambas familias: sin esto Node intenta la IPv6 y se queda
      # esperando. No basta por sí solo —el cliente de almacenamiento además
      # fija IPv4 en su agente— pero es el orden correcto por omisión.
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: postgresql://nexdms:${POSTGRES_PASSWORD:-nexdms_dev}@postgres:5432/nexdms
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexdms_dev}@redis:6379
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    ports:
      # 3010 en el equipo: el 3000 lo ocupa el servidor de desarrollo que se
      # corre fuera de Docker, y con ambos a la vez el contenedor no arranca.
      - '3010:3000'
      - '9229:9229'     # Puerto de debug Node.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run build && npm run migration:run && npm run start:dev"
    networks:
      - nexDMS_net

  # ─── Angular Web (operadores) ──────────────────────────────────
  # Perfil "frontend": activar cuando web/pwa/admin estén creados
  web:
    profiles:
      - frontend
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: nexDMS_web
    restart: unless-stopped
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - '4200:4200'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PROXY_API_TARGET=http://api:3000
    command: npm run start -- --host 0.0.0.0 --poll 1000
    networks:
      - nexDMS_net

  # ─── Angular PWA Mecánico ─────────────────────────────────────
  pwa:
    profiles:
      - frontend
    build:
      context: ./apps/pwa
      dockerfile: Dockerfile
      target: development
    container_name: nexDMS_pwa
    restart: unless-stopped
    volumes:
      - ./apps/pwa:/app
      - /app/node_modules
    ports:
      - '4201:4200'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PROXY_API_TARGET=http://api:3000
    command: npm run start -- --host 0.0.0.0 --poll 1000
    networks:
      - nexDMS_net

  # ─── Angular Admin (superadmin Nexus Q Tech) ──────────────────
  admin:
    profiles:
      - frontend
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: development
    container_name: nexDMS_admin
    restart: unless-stopped
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    ports:
      - '4202:4200'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PROXY_API_TARGET=http://api:3000
    command: npm run start -- --host 0.0.0.0 --poll 1000
    networks:
      - nexDMS_net

  # ─── Portal de recepción (asesores de servicio) ───────────────
  recepcion:
    profiles:
      - frontend
    build:
      context: ./apps/recepcion
      dockerfile: Dockerfile
      target: development
    container_name: nexDMS_recepcion
    restart: unless-stopped
    volumes:
      - ./apps/recepcion:/app
      - /app/node_modules
    ports:
      - '4203:4200'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PROXY_API_TARGET=http://api:3000
    command: npm run start -- --host 0.0.0.0 --poll 1000
    networks:
      - nexDMS_net

  # ─── Nginx reverse proxy ──────────────────────────────────────
  nginx:
    profiles:
      - frontend
    image: nginx:alpine
    container_name: nexDMS_nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - pwa
      - admin
      - recepcion
    networks:
      - nexDMS_net

volumes:
  postgres_data:
  redis_data:

networks:
  nexDMS_net:
    driver: bridge
