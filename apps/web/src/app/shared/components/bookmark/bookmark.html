<div class="bookmark pull-right">
  <ul>
    @for (item of bookmarkItems; track item) {
      <li>
        <a
          [routerLink]="item?.path"
          placement="top"
          ngbTooltip="{{ item?.title }}"
        >
          <app-feather-icons [icon]="item?.icon" />
        </a>
      </li>
    }
    <li>
      <a href="javascript:void(0)" (click)="openBookmarkSearch()">
        <app-feather-icons [icon]="'star'" class="bookmark-search" />
      </a>
      <form class="form-inline search-form bookmark-form">
        <div class="form-group form-control-search" [class.open]="open">
          <input
            type="text"
            [(ngModel)]="text"
            [ngModelOptions]="{ standalone: true }"
            (keyup)="searchTerm(text)"
            placeholder="Buscar…"
          />
          <div
            class="Typeahead-menu"
            [class.is-open]="searchResult"
            id="boomark-search-outer"
          >
            @for (item of menuItems | slice: 0 : 8; track item) {
              <div class="ProfileCard u-cf">
                <div class="ProfileCard-avatar">
                  <app-feather-icons [icon]="item.icon" class="header-search" />
                </div>
                <div class="ProfileCard-details">
                  <div class="ProfileCard-realName">
                    <a
                      [routerLink]="item?.path"
                      class="realname"
                      (click)="removeFix()"
                      >{{ item?.title }}</a
                    >
                    <span class="pull-right">
                      <a
                        href="javascript:void(0)"
                        (click)="addToBookmark(item)"
                      >
                        <i
                          class="fa fa-star-o f-18 mt-1"
                          [class.starred]="item.bookmark"
                        ></i>
                      </a>
                    </span>
                  </div>
                </div>
              </div>
            }
          </div>
          <div class="Typeahead-menu" [class.is-open]="searchResultEmpty">
            <div class="tt-dataset tt-dataset-0">
              <div class="EmptyMessage">Opps!! There are no result found.</div>
            </div>
          </div>
        </div>
      </form>
    </li>
  </ul>
</div>
