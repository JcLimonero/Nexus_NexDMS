<div class="portal-recepcion">
  <header class="pr-top">
    <div class="pr-marca">
      <img src="assets/nexus_images/logo/logo_white.png" alt="Nexus Q Tech" />
      <span>Recepción</span>
    </div>
    <div class="pr-acciones">
      <span class="pr-usuario">{{ usuario() }}</span>
      <button type="button" class="pr-btn" (click)="irAlSistema()">
        Ir al sistema
      </button>
      <button type="button" class="pr-btn" (click)="salir()">Salir</button>
    </div>
  </header>

  <!-- La recepción real: se reutiliza la pantalla del back office para no
       mantener dos versiones del mismo flujo -->
  <main class="pr-cuerpo">
    <app-recepcion-page />
  </main>
</div>
