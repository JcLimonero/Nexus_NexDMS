<div class="pw-wrap">
  <div class="pw-card">
    @if (!listo()) {
      <h1>Nueva contraseña</h1>
      <p class="pw-sub">Crea una contraseña nueva para tu cuenta.</p>
      <form (ngSubmit)="guardar()">
        <label class="pw-field">
          <span>Nueva contraseña</span>
          <input type="password" [ngModel]="pass()" (ngModelChange)="pass.set($event)" name="pass" autocomplete="new-password" placeholder="Mínimo 8 caracteres" />
        </label>
        <label class="pw-field">
          <span>Confirmar contraseña</span>
          <input type="password" [ngModel]="pass2()" (ngModelChange)="pass2.set($event)" name="pass2" autocomplete="new-password" />
        </label>
        @if (error()) { <p class="pw-error">{{ error() }}</p> }
        <button type="submit" class="pw-btn" [disabled]="guardando()">
          {{ guardando() ? "Guardando…" : "Cambiar contraseña" }}
        </button>
      </form>
      <a class="pw-link" [routerLink]="loginLink">Volver a iniciar sesión</a>
    } @else {
      <div class="pw-ok">
        <div class="pw-emoji">✅</div>
        <h1>Contraseña actualizada</h1>
        <p class="pw-sub">Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <a class="pw-btn" [routerLink]="loginLink">Iniciar sesión</a>
      </div>
    }
  </div>
</div>
