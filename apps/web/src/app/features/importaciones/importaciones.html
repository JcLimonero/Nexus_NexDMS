<div class="container-fluid importaciones">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header">
          <h5>Importar catálogos</h5>
          <span>Descarga la plantilla de Excel, llénala y cárgala. No aplica a datos de operación (citas, órdenes, ventas).</span>
        </div>
        <div class="card-body">
          @if (cargando()) {
            <div class="text-center py-4"><span class="spinner-border"></span></div>
          } @else if (error()) {
            <div class="alert alert-danger">{{ error() }}</div>
          } @else {
            <div class="row g-3">
              @for (c of catalogos(); track c.key) {
                <div class="col-md-6 col-xl-4">
                  <div class="card h-100 border">
                    <div class="card-body d-flex flex-column">
                      <h6 class="mb-1">{{ c.label }}</h6>
                      <p class="text-muted small mb-3">
                        Obligatorias: {{ obligatorias(c) || "—" }}
                      </p>
                      <div class="mt-auto">
                        <app-importador [entidad]="c.key"></app-importador>
                      </div>
                    </div>
                  </div>
                </div>
              }
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
