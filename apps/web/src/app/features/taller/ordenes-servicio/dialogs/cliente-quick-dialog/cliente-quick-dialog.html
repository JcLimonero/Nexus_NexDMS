<div class="modal-header">
  <h5 class="modal-title">Nuevo cliente</h5>
  <button type="button" class="btn-close" aria-label="Cerrar" (click)="dismiss()"></button>
</div>
<div class="modal-body">
  <form [formGroup]="form" (ngSubmit)="submit()">
    @if (error) {
      <div class="alert alert-danger py-2">{{ error }}</div>
    }
    <div class="mb-3">
      <label class="form-label">Tipo</label>
      <select class="form-select" formControlName="clientType">
        @for (ct of (clientTypes | async) ?? []; track ct.id) {
          <option [ngValue]="ct.code">{{ ct.label }}</option>
        }
      </select>
    </div>
    @if (form.get('clientType')?.value === 'BUSINESS') {
      <div class="mb-3">
        <label class="form-label">Razón social <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="companyName" />
      </div>
    } @else {
      <div class="row">
        <div class="col-6 mb-3">
          <label class="form-label">Nombre <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="firstName" />
        </div>
        <div class="col-6 mb-3">
          <label class="form-label">Apellido</label>
          <input type="text" class="form-control" formControlName="lastName" />
        </div>
      </div>
    }
    <div class="mb-3">
      <label class="form-label">Teléfono <span class="text-danger">*</span></label>
      <div class="input-group">
        <select class="form-select" style="max-width: 120px" formControlName="phoneLada">
          @for (lada of phoneLadas; track lada.code) {
            <option [ngValue]="lada.code">{{ lada.flag }} {{ lada.code }}</option>
          }
        </select>
        <input type="tel" class="form-control" formControlName="phone" placeholder="5512345678" />
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Correo</label>
      <input type="email" class="form-control" formControlName="email" />
    </div>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="dismiss()">Cancelar</button>
  <button type="button" class="btn btn-primary" (click)="submit()" [disabled]="form.invalid || saving">
    @if (saving) {
      <span class="spinner-border spinner-border-sm me-1"></span>
    }
    Crear cliente
  </button>
</div>
