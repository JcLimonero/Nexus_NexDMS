<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5>{{ isEdit() ? "Editar categoría" : "Nueva categoría" }}</h5>
          <a class="btn btn-outline-secondary btn-sm" routerLink="/parts-inventory/categories">
            Volver
          </a>
        </div>
        <div class="card-body">
          <form class="categoria-form" [formGroup]="form" (ngSubmit)="submit()">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Nombre <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="name" />
                @if (form.get('name')?.invalid && form.get('name')?.touched) {
                  <div class="text-danger small mt-1">El nombre es obligatorio</div>
                }
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" formControlName="description" rows="2"></textarea>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="isActive" formControlName="isActive" />
                  <label class="form-check-label" for="isActive">Activa</label>
                </div>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading()">
                @if (loading()) {
                  <span class="spinner-border spinner-border-sm me-1" role="status"></span>
                }
                {{ isEdit() ? "Guardar cambios" : "Crear categoría" }}
              </button>
              <a class="btn btn-outline-secondary" routerLink="/parts-inventory/categories">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
