<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5>Nuevo período de comisiones</h5>
          <a class="btn btn-outline-secondary btn-sm" routerLink="/reportes/comisiones">Volver</a>
        </div>
        <div class="card-body">
          <form class="comision-period-form" [formGroup]="form" (ngSubmit)="submit()">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Sucursal <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="branchId">
                  <option value="">Seleccionar sucursal</option>
                  @for (b of branches(); track b.id) {
                    <option [ngValue]="b.id">{{ b.name }}</option>
                  }
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Fecha período <span class="text-danger">*</span></label>
                <input type="date" class="form-control" formControlName="periodDate" />
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Tipo <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="type">
                  @for (t of typeOptions; track t.value) {
                    <option [ngValue]="t.value">{{ t.label }}</option>
                  }
                </select>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading()">
                @if (loading()) {
                  <span class="spinner-border spinner-border-sm me-1" role="status"></span>
                }
                Crear período
              </button>
              <a class="btn btn-outline-secondary" routerLink="/reportes/comisiones">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
