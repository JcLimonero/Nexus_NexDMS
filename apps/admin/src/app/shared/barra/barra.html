<header class="app-bar">
  <a class="marca" routerLink="/tenants" aria-label="NexQSystem · Administración">
    <img class="marca-mark" src="nexus/favicon-256.png" alt="Nexus" />
    <span class="marca-txt">
      <span class="marca-nombre">NexQSystem</span>
      <span class="marca-tag">Administración</span>
    </span>
  </a>

  <nav class="nav">
    <a routerLink="/dashboard" routerLinkActive="activo">Inicio</a>
    <a routerLink="/tenants" routerLinkActive="activo">Empresas</a>
    <a routerLink="/precios" routerLinkActive="activo">Planes y precios</a>
    <a routerLink="/catalogos-maestros" routerLinkActive="activo">Catálogos maestros</a>
    <a routerLink="/roles" routerLinkActive="activo">Roles</a>
    <a routerLink="/usuarios" routerLinkActive="activo">Usuarios</a>
  </nav>

  <div class="usuario">
    <button
      type="button"
      class="chip"
      [class.abierto]="menuAbierto()"
      (click)="alternarMenu($event)"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuAbierto()"
      [title]="auth.usuario()?.email"
    >
      <span class="avatar">{{ (auth.usuario()?.email || "?").charAt(0).toUpperCase() }}</span>
      <span class="email">{{ auth.usuario()?.email }}</span>
      <span class="caret" aria-hidden="true">▾</span>
    </button>

    @if (menuAbierto()) {
      <div class="menu" role="menu" (click)="$event.stopPropagation()">
        <div class="menu-usuario">
          <span class="menu-nombre">
            {{ auth.usuario()?.firstName }} {{ auth.usuario()?.lastName }}
          </span>
          <span class="menu-email">{{ auth.usuario()?.email }}</span>
        </div>
        <button type="button" class="menu-item peligro" role="menuitem" (click)="salir()">
          Salir
        </button>
      </div>
    }
  </div>
</header>

<div class="page-head">
  <div>
    <h1>{{ titulo() }}</h1>
    @if (subtitulo()) {
      <p>{{ subtitulo() }}</p>
    }
  </div>
</div>
