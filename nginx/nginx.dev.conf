events {
  worker_connections 1024;
}

http {
  upstream api       { server api:3000; }
  upstream web       { server web:4200; }
  upstream pwa       { server pwa:4200; }
  upstream admin     { server admin:4200; }
  upstream recepcion { server recepcion:4200; }

  # API
  server {
    listen 80;
    server_name api.localhost;
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # Web operadores
  server {
    listen 80;
    server_name app.localhost;
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # PWA mecánico
  server {
    listen 80;
    server_name pwa.localhost;
    location / {
      proxy_pass http://pwa;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # Recepción (iPad)
  server {
    listen 80;
    server_name recepcion.localhost;
    location / {
      proxy_pass http://recepcion;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # Admin superadmin
  server {
    listen 80;
    server_name admin.localhost;
    location / {
      proxy_pass http://admin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # Acceso por IP de la LAN, para probar desde el teléfono en el mismo Wi‑Fi.
  # Atiende cualquier host no nombrado (la IP de la Mac) y sirve el DMS. Le dice
  # al dev-server que es "app.localhost" para que acepte la petición, y su proxy
  # interno de /api sigue llegando a la API. Es solo para desarrollo/demostración.
  server {
    listen 80 default_server;
    server_name _;
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host app.localhost;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
