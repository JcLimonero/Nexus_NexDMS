events {
  worker_connections 2048;
}

http {
  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1000;

  upstream api   { server api:3000; }
  upstream web   { server web:80; }
  upstream pwa   { server pwa:80; }
  upstream admin { server admin:80; }

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # API
  server {
    listen 443 ssl;
    server_name api.nexdms.com;
    ssl_certificate     /etc/nginx/certs/api.nexdms.com.crt;
    ssl_certificate_key /etc/nginx/certs/api.nexdms.com.key;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      client_max_body_size 25M;
    }
  }

  # Web operadores
  server {
    listen 443 ssl;
    server_name app.nexdms.com;
    ssl_certificate     /etc/nginx/certs/app.nexdms.com.crt;
    ssl_certificate_key /etc/nginx/certs/app.nexdms.com.key;

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # PWA mecánico
  server {
    listen 443 ssl;
    server_name pwa.nexdms.com;
    ssl_certificate     /etc/nginx/certs/pwa.nexdms.com.crt;
    ssl_certificate_key /etc/nginx/certs/pwa.nexdms.com.key;

    location / {
      proxy_pass http://pwa;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # Admin superadmin
  server {
    listen 443 ssl;
    server_name admin.nexdms.com;
    ssl_certificate     /etc/nginx/certs/admin.nexdms.com.crt;
    ssl_certificate_key /etc/nginx/certs/admin.nexdms.com.key;

    # Solo IPs de Nexus Q Tech
    allow 200.1.2.3;   # ← reemplazar con IP real de la oficina
    deny all;

    location / {
      proxy_pass http://admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
